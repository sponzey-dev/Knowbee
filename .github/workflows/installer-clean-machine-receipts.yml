name: installer clean machine receipts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable v-prefixed prerelease tag
        required: true
        type: string
      candidate_run_id:
        description: Exact successful installer candidate workflow run
        required: true
        type: string

jobs:
  exercise-clean-machine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs_on: macos-latest
          - target: darwin-x64
            runs_on: macos-15-intel
          - target: linux-x64
            runs_on: ubuntu-latest
          - target: win32-arm64
            runs_on: windows-11-arm
          - target: win32-x64
            runs_on: windows-latest
    runs-on: ${{ matrix.runs_on }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@v4
        with:
          name: installer-release-candidate-${{ inputs.release_tag }}
          path: release/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Exercise exact hosted installer lifecycle
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_TARGET: ${{ matrix.target }}
          REBOOT_RECOVERY_LIMITATION: github_hosted_runner_disposable
          KNOWBEE_INSTALLER_FIELD_DEBUG: "1"
        run: node scripts/run-installer-hosted-clean-machine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-clean-machine-receipt-${{ matrix.target }}
          path: release/clean-receipt/clean-machine-receipt-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
