name: installer release finalize

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable v-prefixed candidate tag
        required: true
        type: string
      candidate_run_id:
        description: installer candidate workflow run containing the candidate artifact
        required: true
        type: string
      evidence_run_id:
        description: Clean-machine workflow run containing candidate-bound evidence
        required: true
        type: string

jobs:
  finalize-installer-prerelease:
    runs-on: ubuntu-latest
    environment: installer-release-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@v4
        with:
          name: installer-release-candidate-${{ inputs.release_tag }}
          path: release/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: installer-clean-machine-evidence-${{ inputs.release_tag }}
          path: release/evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
      - name: Render unsigned publishable bootstraps
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-installer-release.mjs finalize \
            --manifest release/candidate/prepared/installer-manifest.json \
            --verifier-receipts release/candidate/receipts/verifier-receipts.json \
            --platform-evidence release/evidence/platform-evidence.json \
            --dry-run-receipts release/evidence/dry-run-receipts.json \
            --rollback-receipt release/evidence/rollback-receipt.json \
            --posix-template installer/install.sh \
            --powershell-template installer/install.ps1 \
            --output-dir release/final-installer
          test -f release/final-installer/installer-release-gate.json
      - name: Build finalized installer asset inventory
        id: finalized_inventory
        continue-on-error: true
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          finalization_stage=asset_directory
          trap 'printf "{\"status\":\"rejected\",\"reasonCode\":\"installer_finalized_workflow_failed:%s\"}\\n" "$finalization_stage" > release/finalized-inventory-result.log' ERR
          mkdir -p release/finalized-assets
          finalization_stage=fixed_asset_copy
          cp release/final-installer/install.sh release/finalized-assets/
          cp release/final-installer/install.ps1 release/finalized-assets/
          cp release/final-installer/installer-manifest.json release/finalized-assets/
          cp release/final-installer/installer-release-gate.json release/finalized-assets/
          finalization_stage=bundle_discovery
          mapfile -t bundle_assets < <(node -e 'const fs=require("node:fs"); const values=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const seen=new Set(); if(!Array.isArray(values)||values.length!==5) process.exit(1); for(const value of values){if(typeof value?.target!=="string"||!seen.add(value.target)||typeof value.name!=="string"||!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(value.name)) process.exit(1); process.stdout.write(`release/candidate/bundles/installer-bundle-${value.target}/${value.name}\\n`)}' release/candidate/receipts/artifact-receipts.json)
          finalization_stage=verifier_discovery
          mapfile -t verifier_assets < <(node -e 'const fs=require("node:fs"); const values=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const seen=new Set(); if(!Array.isArray(values)||values.length!==5) process.exit(1); for(const value of values){if(typeof value?.target!=="string"||!seen.add(value.target)||typeof value.name!=="string"||!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(value.name)) process.exit(1); process.stdout.write(`release/candidate/verifiers/installer-verifier-${value.target}/${value.name}\\n`)}' release/candidate/receipts/verifier-receipts.json)
          finalization_stage=bundle_count
          test "${#bundle_assets[@]}" -eq 5
          finalization_stage=verifier_count
          test "${#verifier_assets[@]}" -eq 5
          finalization_stage=asset_copy
          cp "${bundle_assets[@]}" release/finalized-assets/
          cp "${verifier_assets[@]}" release/finalized-assets/
          finalization_stage=candidate_identity
          candidate_id="sha256:$(sha256sum release/final-installer/installer-manifest.json | awk '{print $1}')"
          finalization_stage=inventory_collect
          set +e
          node --input-type=module --eval '
            import { runInstallerFinalizedAssetsCli } from "./scripts/collect-installer-finalized-assets.mjs"
            const emit = (result) => {
              process.stdout.write(`${JSON.stringify(result)}\\n`)
              if (result.status !== "ready" && result.status !== "verified") process.exitCode = 1
            }
            try {
              emit(await runInstallerFinalizedAssetsCli(process.argv.slice(1)))
            } catch {
              emit({ status: "rejected", reasonCode: "installer_finalized_execution_failed" })
            }
          ' collect \
            --candidate-id "$candidate_id" \
            --release-tag "$RELEASE_TAG" \
            --asset-root release/finalized-assets \
            --artifact-receipts release/candidate/receipts/artifact-receipts.json \
            --verifier-receipts release/candidate/receipts/verifier-receipts.json \
            --output-dir release/finalized-inventory > release/finalized-inventory-result.log 2>&1
          collect_status=$?
          set -e
          cat release/finalized-inventory-result.log
          test "$collect_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-finalized-inventory-diagnostic-${{ inputs.release_tag }}
          path: release/finalized-inventory-result.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce finalized installer asset inventory
        if: steps.finalized_inventory.outcome != 'success'
        shell: bash
        run: exit 1
      - name: Verify rehearsal bytes and add immutable final metadata
        if: steps.finalized_inventory.outcome == 'success'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = true
          gh release edit "$RELEASE_TAG" --prerelease
          mkdir -p release/published-rehearsal-assets
          mapfile -t finalized_assets < <(find release/finalized-assets -type f | sort)
          test "${#finalized_assets[@]}" -eq 14
          verified_rehearsal_count=0
          for asset in "${finalized_assets[@]}"; do
            name="$(basename "$asset")"
            if test "$name" = installer-release-gate.json; then
              continue
            fi
            gh release download "$RELEASE_TAG" \
              --pattern "$name" \
              --dir release/published-rehearsal-assets
            cmp --silent "$asset" "release/published-rehearsal-assets/$name"
            verified_rehearsal_count=$((verified_rehearsal_count + 1))
          done
          test "$verified_rehearsal_count" -eq 13
          gh release upload "$RELEASE_TAG" \
            release/finalized-inventory/installer-finalized-assets.json \
            release/finalized-assets/installer-release-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: installer-finalized-assets-${{ inputs.release_tag }}
          path: |
            release/finalized-assets
            release/finalized-inventory
          if-no-files-found: error
          retention-days: 90
